name: Deploy Prod
on:
  push:
    branches: ["main"]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: depromeet/17th-team1-client/globber-frontend

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ghcr.io/depromeet/17th-team1-client/globber-frontend:latest
          build-args: |
            NEXT_PUBLIC_API_BASE_URL=https://globber.world/api
            NEXT_PUBLIC_REDIRECT_ORIGIN=https://globber.world
            NEXT_PUBLIC_GOOGLE_MAPS_API_KEY=${{ secrets.GOOGLE_MAPS_API_KEY }}
            NEXT_PUBLIC_S3_BASE_URL=https://globber-prod.s3.ap-northeast-2.amazonaws.com/
            GOOGLE_MAPS_API_KEY=${{ secrets.GOOGLE_MAPS_API_KEY }}
            NEXT_PUBLIC_GA_MEASUREMENT_ID=G-4GKGEVDP57
            NEXT_PUBLIC_MAINTENANCE_MODE=false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: self-hosted
    steps:
      - name: Login to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
      - name: Pull & Deploy
        env:
          SENTRY_WEBHOOK_SECRET: ${{ secrets.SENTRY_WEBHOOK_SECRET }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          cd ~/17th-team1-client
          # 알림 설정이 없어도 서비스 배포는 막지 않고, 경고만 남긴다 (웹훅 라우트는 503 응답)
          if [ -z "$SENTRY_WEBHOOK_SECRET" ] || [ -z "$DISCORD_WEBHOOK_URL" ]; then
            echo "::warning::SENTRY_WEBHOOK_SECRET 또는 DISCORD_WEBHOOK_URL이 비어 있어 Sentry→Discord 알림이 동작하지 않습니다. 배포는 계속합니다."
          fi
          # 런타임 비밀값을 서버 compose 파일에 직접 쓰지 않고, 배포 시 보조 compose 파일로 주입
          umask 077
          cat > docker-compose.secrets.yml <<EOF
          services:
            frontend:
              environment:
                SENTRY_WEBHOOK_SECRET: "${SENTRY_WEBHOOK_SECRET}"
                DISCORD_WEBHOOK_URL: "${DISCORD_WEBHOOK_URL}"
          EOF
          docker compose -f docker-compose-prod.yml pull frontend
          docker compose -f docker-compose-prod.yml -f docker-compose.secrets.yml up -d --force-recreate --no-build frontend
          docker image prune -f
